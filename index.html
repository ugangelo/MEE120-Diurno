<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEE120 - Diurno</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #263238;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1450px;
            margin: 28px auto;
            padding: 0 20px 50px;
        }

        /* LEGENDA */

        .legenda {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);

            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: center;
        }

        .legenda-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
        }

        .administracao {
            margin-left: auto;
        }

        .botao-admin {
            display: inline-block;
            padding: 9px 13px;
            border-radius: 7px;
            background: #1f4e79;
            color: white;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
        }

        .cor {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .cor-academico {
            background: #a9c99a;
        }

        .cor-avaliacao {
            background: #80b98c;
        }

        .cor-atencao {
            background: #f4df72;
        }

        .cor-nao-letivo {
            background: #ef8585;
        }

        .cor-desativado {
            background: #e1e4e8;
        }


        /* CALENDÁRIOS */

        .calendarios {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .mes {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
        }

        .mes h2 {
            margin: 0;
            padding: 15px;
            text-align: center;
            background: #dce6f1;
            color: #1f4e79;
            font-size: 22px;
        }

        .semana,
        .dias {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .semana div {
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            padding: 10px 3px;
            background: #eef2f5;
            border-bottom: 1px solid #ddd;
        }

        .dia {
            position: relative;
            min-height: 105px;
            padding: 7px;
            border-right: 1px solid #e3e6e8;
            border-bottom: 1px solid #e3e6e8;
            background: white;
        }

        .dia:nth-child(7n) {
            border-right: none;
        }

        .numero {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 25px;
            height: 25px;

            font-weight: bold;
            font-size: 14px;
            border-radius: 50%;
        }

        .vazio {
            background: #f7f8f9;
        }

        .domingo {
            background: #f0f2f4;
        }

        .dia-clicavel {
            cursor: pointer;
        }

        .dia-clicavel:hover,
        .dia-clicavel:focus-visible {
            outline: 2px solid #1f4e79;
            outline-offset: -2px;
        }

        .conteudo-aula {
            margin-top: 5px;
            padding: 4px 5px;
            border-radius: 5px;
            background: #d7e8f7;
            color: #163a5b;
            font-size: 10px;
            line-height: 1.25;
            font-weight: 600;
        }

        /* DIAS ANTERIORES AO INÍCIO */

        .desativado {
            background: #e1e4e8 !important;
            color: #92979d !important;
        }

        .desativado .numero {
            color: #92979d !important;
        }


        /* EVENTOS */

        .evento {
            margin-top: 5px;
            padding: 4px 5px;
            border-radius: 5px;

            font-size: 10px;
            line-height: 1.25;
            font-weight: 600;
        }

        .evento-academico {
            background: #a9c99a;
        }

        .evento-avaliacao {
            background: #80b98c;
        }

        .evento-atencao {
            background: #f4df72;
        }

        .evento-nao-letivo {
            background: #ef8585;
        }


        /* DIA NÃO LETIVO */

        .dia.nao-letivo {
            background: #f8c6c6;
        }

        .dia.nao-letivo .numero {
            background: #d94d4d;
            color: white;
        }


        /* JANELA DE CONTEÚDO */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(20, 32, 43, 0.55);
        }

        .modal[hidden] {
            display: none;
        }

        .modal-conteudo {
            width: min(560px, 100%);
            max-height: 85vh;
            overflow: auto;
            padding: 24px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
        }

        .modal-topo {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
        }

        .modal h3 {
            margin: 0 0 16px;
            color: #1f4e79;
        }

        .modal-fechar {
            border: 0;
            background: transparent;
            color: #555;
            cursor: pointer;
            font-size: 25px;
            line-height: 1;
        }

        .modal-texto {
            line-height: 1.55;
            white-space: pre-wrap;
        }


        footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 13px;
        }


        @media (max-width: 950px) {

            .calendarios {
                grid-template-columns: 1fr;
            }

            .administracao {
                width: 100%;
                margin-left: 0;
            }

        }

    </style>
</head>


<body>

<header>

    <h1>MEE120 - Diurno</h1>

    <p>
        Cronograma da Disciplina —
        2º Semestre de 2026
    </p>

</header>


<div class="container">

    <div class="legenda">

        <div class="legenda-item">
            <span class="cor cor-academico"></span>
            Atividade acadêmica
        </div>

        <div class="legenda-item">
            <span class="cor cor-avaliacao"></span>
            Avaliação
        </div>

        <div class="legenda-item">
            <span class="cor cor-atencao"></span>
            Prazo
        </div>

        <div class="legenda-item">
            <span class="cor cor-nao-letivo"></span>
            Feriado / dia não letivo
        </div>

        <div class="legenda-item">
            <span class="cor cor-desativado"></span>
            Período anterior às aulas
        </div>

        <div class="administracao">
            <a
                class="botao-admin"
                href="https://github.com/ugangelo/MEE120-Diurno/edit/main/conteudos.json"
                target="_blank"
                rel="noopener noreferrer">
                Cadastrar conteúdo
            </a>
        </div>

    </div>


    <div
        class="calendarios"
        id="calendarios">
    </div>


    <footer>
        MEE120 - Diurno |
        2º semestre de 2026
    </footer>

</div>


<div
    class="modal"
    id="modal-conteudo"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-titulo"
    hidden>

    <div class="modal-conteudo">
        <div class="modal-topo">
            <h3 id="modal-titulo"></h3>
            <button
                class="modal-fechar"
                id="modal-fechar"
                type="button"
                aria-label="Fechar">
                &times;
            </button>
        </div>

        <div
            class="modal-texto"
            id="modal-texto">
        </div>
    </div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */

const ano = 2026;

const meses = [
    { numero: 7, nome: "Agosto" },
    { numero: 8, nome: "Setembro" },
    { numero: 9, nome: "Outubro" },
    { numero: 10, nome: "Novembro" },
    { numero: 11, nome: "Dezembro" }
];

let conteudos = {};


/* =========================================================
   EVENTOS RELEVANTES PARA A DISCIPLINA
   ========================================================= */

const eventos = [

    /* AGOSTO */

    {
        inicio: "2026-08-10",
        fim: "2026-08-10",
        texto: "Início do período letivo",
        tipo: "academico"
    },

    {
        inicio: "2026-08-20",
        fim: "2026-08-20",
        texto: "Aniversário de São Bernardo do Campo",
        tipo: "nao-letivo"
    },


    /* SETEMBRO */

    {
        inicio: "2026-09-07",
        fim: "2026-09-07",
        texto: "Independência do Brasil",
        tipo: "nao-letivo"
    },

    {
        inicio: "2026-09-19",
        fim: "2026-09-19",
        texto: "FEI Portas Abertas — dia não letivo",
        tipo: "nao-letivo"
    },

    {
        inicio: "2026-09-22",
        fim: "2026-10-03",
        texto: "P1",
        tipo: "avaliacao"
    },


    /* OUTUBRO */

    {
        inicio: "2026-10-12",
        fim: "2026-10-12",
        texto: "Nossa Senhora da Aparecida",
        tipo: "nao-letivo"
    },

    {
        inicio: "2026-10-13",
        fim: "2026-10-13",
        texto: "Dia do Professor — dia não letivo",
        tipo: "nao-letivo"
    },

    {
        inicio: "2026-10-14",
        fim: "2026-10-24",
        texto: "Escolha de disciplinas optativas",
        tipo: "academico"
    },


    /* NOVEMBRO */

    {
        inicio: "2026-11-02",
        fim: "2026-11-02",
        texto: "Finados",
        tipo: "nao-letivo"
    },

    {
        inicio: "2026-11-11",
        fim: "2026-11-11",
        texto: "INOVAFEI",
        tipo: "academico"
    },

    {
        inicio: "2026-11-15",
        fim: "2026-11-15",
        texto: "Proclamação da República",
        tipo: "nao-letivo"
    },

    {
        inicio: "2026-11-16",
        fim: "2026-11-16",
        texto: "Prazo máximo para trancamento",
        tipo: "atencao"
    },

    {
        inicio: "2026-11-19",
        fim: "2026-12-01",
        texto: "P2",
        tipo: "avaliacao"
    },

    {
        inicio: "2026-11-20",
        fim: "2026-11-20",
        texto: "Consciência Negra",
        tipo: "nao-letivo"
    },


    /* DEZEMBRO */

    {
        inicio: "2026-12-07",
        fim: "2026-12-15",
        texto: "P3",
        tipo: "avaliacao"
    },

    {
        inicio: "2026-12-18",
        fim: "2026-12-18",
        texto: "Término do período letivo",
        tipo: "nao-letivo"
    },

    {
        inicio: "2026-12-25",
        fim: "2026-12-25",
        texto: "Natal",
        tipo: "nao-letivo"
    }

];


/* =========================================================
   FUNÇÕES
   ========================================================= */

function formatarData(ano, mes, dia) {

    return (
        ano +
        "-" +
        String(mes + 1).padStart(2, "0") +
        "-" +
        String(dia).padStart(2, "0")
    );

}


function eventosDoDia(data) {

    return eventos.filter(evento =>
        data >= evento.inicio &&
        data <= evento.fim
    );

}


function abrirConteudo(data) {

    const modal =
        document.getElementById("modal-conteudo");

    const titulo =
        document.getElementById("modal-titulo");

    const texto =
        document.getElementById("modal-texto");

    const conteudo = conteudos[data];

    const dataFormatada =
        new Intl.DateTimeFormat(
            "pt-BR",
            {
                timeZone: "UTC",
                dateStyle: "long"
            }
        ).format(new Date(data + "T12:00:00Z"));

    titulo.textContent =
        conteudo?.titulo || "Conteúdo da aula";

    texto.textContent = conteudo?.conteudo
        ? dataFormatada + "\n\n" + conteudo.conteudo
        : dataFormatada + "\n\nNenhum conteúdo cadastrado para este dia.";

    modal.hidden = false;

    document.getElementById("modal-fechar").focus();

}


function fecharConteudo() {

    document.getElementById("modal-conteudo").hidden = true;

}


function criarCalendario(mes, nomeMes) {

    const calendario =
        document.createElement("div");

    calendario.className = "mes";


    const titulo =
        document.createElement("h2");

    titulo.textContent =
        nomeMes + " " + ano;

    calendario.appendChild(titulo);


    /* CABEÇALHO DA SEMANA */

    const semana =
        document.createElement("div");

    semana.className = "semana";

    [
        "DOM",
        "SEG",
        "TER",
        "QUA",
        "QUI",
        "SEX",
        "SÁB"
    ].forEach(nome => {

        const item =
            document.createElement("div");

        item.textContent = nome;

        semana.appendChild(item);

    });

    calendario.appendChild(semana);


    /* ÁREA DOS DIAS */

    const dias =
        document.createElement("div");

    dias.className = "dias";


    const primeiroDia =
        new Date(
            ano,
            mes,
            1
        ).getDay();

    const quantidadeDias =
        new Date(
            ano,
            mes + 1,
            0
        ).getDate();


    /* ESPAÇOS VAZIOS ANTES DO DIA 1 */

    for (
        let i = 0;
        i < primeiroDia;
        i++
    ) {

        const vazio =
            document.createElement("div");

        vazio.className =
            "dia vazio";

        dias.appendChild(vazio);

    }


    /* DIAS DO MÊS */

    for (
        let dia = 1;
        dia <= quantidadeDias;
        dia++
    ) {

        const dataAtual =
            new Date(
                ano,
                mes,
                dia
            );

        const dataTexto =
            formatarData(
                ano,
                mes,
                dia
            );


        const elementoDia =
            document.createElement("div");

        elementoDia.className = "dia";

        elementoDia.dataset.data = dataTexto;


        /* 1 A 8 DE AGOSTO EM CINZA */

        if (
            dataTexto >= "2026-08-01" &&
            dataTexto <= "2026-08-08"
        ) {

            elementoDia.classList.add(
                "desativado"
            );

        }


        /* DOMINGOS */

        if (
            dataAtual.getDay() === 0 &&
            !elementoDia.classList.contains("desativado")
        ) {

            elementoDia.classList.add(
                "domingo"
            );

        }


        /* NÚMERO DO DIA */

        const numero =
            document.createElement("span");

        numero.className = "numero";

        numero.textContent = dia;

        elementoDia.appendChild(numero);


        /* EVENTOS DO DIA */

        const eventosHoje =
            dataAtual.getDay() === 0
                ? []
                : eventosDoDia(dataTexto);


        eventosHoje.forEach(evento => {

            const bloco =
                document.createElement("div");

            bloco.className =
                "evento evento-" +
                evento.tipo;

            bloco.textContent =
                evento.texto;

            elementoDia.appendChild(bloco);


            if (
                evento.tipo ===
                "nao-letivo"
            ) {

                elementoDia.classList.add(
                    "nao-letivo"
                );

            }

        });


        /* CONTEÚDO DA AULA */

        const conteudoDoDia =
            dataAtual.getDay() !== 0 &&
            !elementoDia.classList.contains("desativado")
                ? conteudos[dataTexto]
                : null;

        if (conteudoDoDia) {

            const blocoConteudo =
                document.createElement("div");

            blocoConteudo.className =
                "conteudo-aula";

            blocoConteudo.textContent =
                conteudoDoDia.titulo || "Conteúdo da aula";

            elementoDia.appendChild(
                blocoConteudo
            );

        }


        if (
            dataAtual.getDay() !== 0 &&
            !elementoDia.classList.contains("desativado")
        ) {

            elementoDia.classList.add("dia-clicavel");
            elementoDia.tabIndex = 0;
            elementoDia.setAttribute(
                "aria-label",
                "Ver conteúdo de " + dataTexto
            );

            elementoDia.addEventListener(
                "click",
                () => abrirConteudo(dataTexto)
            );

            elementoDia.addEventListener(
                "keydown",
                evento => {
                    if (
                        evento.key === "Enter" ||
                        evento.key === " "
                    ) {
                        evento.preventDefault();
                        abrirConteudo(dataTexto);
                    }
                }
            );

        }


        dias.appendChild(
            elementoDia
        );

    }


    calendario.appendChild(dias);

    return calendario;

}


/* =========================================================
   MONTAGEM DO CALENDÁRIO
   ========================================================= */

async function montarCalendarios() {

    try {

        const resposta = await fetch(
            "conteudos.json",
            { cache: "no-store" }
        );

        if (!resposta.ok) {
            throw new Error("Não foi possível carregar os conteúdos.");
        }

        conteudos = await resposta.json();

    } catch (erro) {

        console.warn(erro.message);

    }

    const area =
        document.getElementById(
            "calendarios"
        );

    meses.forEach(mes => {

        area.appendChild(
            criarCalendario(
                mes.numero,
                mes.nome
            )
        );

    });

}


document.getElementById("modal-fechar").addEventListener(
    "click",
    fecharConteudo
);

document.getElementById("modal-conteudo").addEventListener(
    "click",
    evento => {
        if (evento.target.id === "modal-conteudo") {
            fecharConteudo();
        }
    }
);

document.addEventListener(
    "keydown",
    evento => {
        if (evento.key === "Escape") {
            fecharConteudo();
        }
    }
);

montarCalendarios();

</script>

</body>

</html>
