<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEE120 - Diurno</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #263238;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1450px;
            margin: 28px auto;
            padding: 0 20px 50px;
        }

        /* LEGENDA */

        .legenda {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);

            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: center;
        }

        .legenda-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
        }

        .cor {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .cor-evento {
            background: #86c5da;
        }

        .cor-academico {
            background: #a9c99a;
        }

        .cor-avaliacao {
            background: #80b98c;
        }

        .cor-atencao {
            background: #f4df72;
        }

        .cor-nao-letivo {
            background: #ef8585;
        }

        .cor-especial {
            background: #e8a7d3;
        }


        /* CALENDÁRIOS */

        .calendarios {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .mes {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
        }

        .mes h2 {
            margin: 0;
            padding: 15px;
            text-align: center;
            background: #dce6f1;
            color: #1f4e79;
            font-size: 22px;
        }

        .semana,
        .dias {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .semana div {
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            padding: 10px 3px;
            background: #eef2f5;
            border-bottom: 1px solid #ddd;
        }

        .dia {
            position: relative;
            min-height: 105px;
            padding: 7px;
            border-right: 1px solid #e3e6e8;
            border-bottom: 1px solid #e3e6e8;
            background: white;
        }

        .dia:nth-child(7n) {
            border-right: none;
        }

        .numero {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 25px;
            height: 25px;

            font-weight: bold;
            font-size: 14px;
            border-radius: 50%;
        }

        .vazio {
            background: #f7f8f9;
        }

        .domingo {
            background: #fff5f5;
        }

        .domingo .numero {
            color: #b62323;
        }


        /* EVENTOS */

        .evento {
            margin-top: 5px;
            padding: 4px 5px;
            border-radius: 5px;

            font-size: 10px;
            line-height: 1.25;
            font-weight: 600;
        }

        .evento-institucional {
            background: #86c5da;
        }

        .evento-academico {
            background: #a9c99a;
        }

        .evento-avaliacao {
            background: #80b98c;
        }

        .evento-atencao {
            background: #f4df72;
        }

        .evento-nao-letivo {
            background: #ef8585;
        }

        .evento-especial {
            background: #e8a7d3;
        }


        /* QUANDO O DIA INTEIRO NÃO É LETIVO */

        .dia.nao-letivo {
            background: #f8c6c6;
        }

        .dia.nao-letivo .numero {
            background: #d94d4d;
            color: white;
        }


        footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 13px;
        }


        @media (max-width: 950px) {

            .calendarios {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>

<header>

    <h1>MEE120 - Diurno</h1>

    <p>
        Cronograma da Disciplina —
        2º Semestre de 2026
    </p>

</header>


<div class="container">

    <div class="legenda">

        <div class="legenda-item">
            <span class="cor cor-evento"></span>
            Evento institucional
        </div>

        <div class="legenda-item">
            <span class="cor cor-academico"></span>
            Atividade acadêmica
        </div>

        <div class="legenda-item">
            <span class="cor cor-avaliacao"></span>
            Avaliação
        </div>

        <div class="legenda-item">
            <span class="cor cor-atencao"></span>
            Prazo / matrícula
        </div>

        <div class="legenda-item">
            <span class="cor cor-nao-letivo"></span>
            Feriado / dia não letivo
        </div>

        <div class="legenda-item">
            <span class="cor cor-especial"></span>
            Processo seletivo
        </div>

    </div>


    <div
        class="calendarios"
        id="calendarios">
    </div>


    <footer>
        MEE120 - Diurno |
        Calendário Acadêmico FEI |
        2º semestre de 2026
    </footer>

</div>


<script>

/* =========================================================

const meses = [

/* =========================================================

    },

    /* DEZEMBRO */

    {

    },

    {
        inicio: "2026-12-25",
        fim: "2026-12-25",
        texto: "Natal",
        tipo: "nao-letivo"
    }

];


/* =========================================================
   FUNÇÕES
   ========================================================= */

function formatarData(ano, mes, dia) {

    return (
        ano +
        "-" +
        String(mes + 1).padStart(2, "0") +
        "-" +
        String(dia).padStart(2, "0")
    );

}


function eventosDoDia(data) {

    return eventos.filter(evento =>
        data >= evento.inicio &&
        data <= evento.fim
    );

}


function criarCalendario(mes, nomeMes) {

    const calendario = document.createElement("div");

    calendario.className = "mes";


    const titulo = document.createElement("h2");

    titulo.textContent =
        nomeMes + " " + ano;

    calendario.appendChild(titulo);


    /* Cabeçalho da semana */

    const semana = document.createElement("div");

    semana.className = "semana";

    [
        "DOM",
        "SEG",
        "TER",
        "QUA",
        "QUI",
        "SEX",
        "SÁB"
    ].forEach(nome => {

        const item =
            document.createElement("div");

        item.textContent = nome;

        semana.appendChild(item);

    });

    calendario.appendChild(semana);


    /* Dias */

    const dias =
        document.createElement("div");

    dias.className = "dias";


    const primeiroDia =
        new Date(ano, mes, 1).getDay();

    const quantidadeDias =
        new Date(
            ano,
            mes + 1,
            0
        ).getDate();


    /* Espaços vazios antes do dia 1 */

    for (
        let i = 0;
        i < primeiroDia;
        i++
    ) {

        const vazio =
            document.createElement("div");

        vazio.className =
            "dia vazio";

        dias.appendChild(vazio);

    }


    /* Dias do mês */

    for (
        let dia = 1;
        dia <= quantidadeDias;
        dia++
    ) {

        const dataAtual =
            new Date(
                ano,
                mes,
                dia
            );

        const dataTexto =
            formatarData(
                ano,
                mes,
                dia
            );


        const elementoDia =
            document.createElement("div");

        elementoDia.className = "dia";


        /* Domingo */

        if (
            dataAtual.getDay() === 0
        ) {

            elementoDia.classList.add(
                "domingo"
            );

        }


        const numero =
            document.createElement("span");

        numero.className = "numero";

        numero.textContent = dia;

        elementoDia.appendChild(numero);


        /* Eventos desse dia */

        const eventosHoje =
            eventosDoDia(dataTexto);


        eventosHoje.forEach(evento => {

            const bloco =
                document.createElement("div");

            bloco.className =
                "evento evento-" +
                evento.tipo;

            bloco.textContent =
                evento.texto;

            elementoDia.appendChild(bloco);


            if (
                evento.tipo ===
                "nao-letivo"
            ) {

                elementoDia.classList.add(
                    "nao-letivo"
                );

            }

        });


        dias.appendChild(
            elementoDia
        );

    }


    calendario.appendChild(dias);

    return calendario;

}


/* =========================================================
   MONTAGEM
   ========================================================= */

const area =
    document.getElementById(
        "calendarios"
    );


meses.forEach(mes => {

    area.appendChild(
        criarCalendario(
            mes.numero,
            mes.nome
        )
    );

});

</script>

</body>

</html>
